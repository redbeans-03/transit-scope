[project]
name = "kepler8-photometry"
version = "0.1.0"
description = "Transit photometry pipeline for Kepler-8b: MAST light curve extraction, limb-darkening-corrected radius, and SNR analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "lightkurve>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kepler8-extract = "kepler8.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kepler8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
